name: 🚀 Auto-Deploy Synq Chat to VPS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
        - development

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'

    - name: 📦 Install dependencies
      run: |
        yarn install --frozen-lockfile
        cd apps/meteor && yarn install --frozen-lockfile

    - name: 🧪 Run tests
      run: |
        yarn test:unit
        cd apps/meteor && yarn test:unit

    - name: 🔨 Build application
      run: |
        yarn build
        cd apps/meteor && yarn build

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: 📋 Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/synq-chat
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🏗️ Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Job 2: Deploy to VPS
  deploy-to-vps:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ env.VPS_SSH_KEY }}

    - name: 🚀 Deploy to VPS
      run: |
        # Create deployment script
        cat > deploy-to-vps.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "🚀 Déploiement automatique Synq Chat sur VPS"
        echo "📦 Image: ${{ needs.build-and-test.outputs.image-tag }}"
        echo "🏷️ Tag: ${{ needs.build-and-test.outputs.image-digest }}"
        
        # Variables
        IMAGE_TAG="${{ needs.build-and-test.outputs.image-tag }}"
        DEPLOY_PATH="${{ env.VPS_DEPLOY_PATH }}"
        BRANCH_NAME="${{ github.ref_name }}"
        COMMIT_SHA="${{ github.sha }}"
        
        # Login to Docker registry
        echo "🔐 Connexion au registry Docker..."
        echo "${{ env.DOCKER_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u "${{ env.DOCKER_USERNAME }}" --password-stdin
        
        # Pull latest image
        echo "📥 Téléchargement de la nouvelle image..."
        docker pull $IMAGE_TAG
        
        # Stop existing containers
        echo "⏹️ Arrêt des conteneurs existants..."
        cd $DEPLOY_PATH
        docker-compose -f docker-compose.production.yml down || true
        
        # Update docker-compose.yml with new image
        echo "📝 Mise à jour de la configuration..."
        sed -i "s|image: .*synq-chat.*|image: $IMAGE_TAG|g" docker-compose.production.yml
        
        # Start new containers
        echo "▶️ Démarrage des nouveaux conteneurs..."
        docker-compose -f docker-compose.production.yml up -d
        
        # Wait for health check
        echo "⏳ Vérification de la santé de l'application..."
        sleep 30
        
        # Health check
        if curl -f http://localhost/health > /dev/null 2>&1; then
          echo "✅ Application déployée avec succès!"
        else
          echo "❌ Échec du déploiement - Application non accessible"
          exit 1
        fi
        
        # Cleanup old images
        echo "🧹 Nettoyage des anciennes images..."
        docker image prune -f
        
        # Log deployment
        echo "📝 Log du déploiement..."
        echo "$(date): Déploiement réussi - Branch: $BRANCH_NAME, Commit: $COMMIT_SHA, Image: $IMAGE_TAG" >> $DEPLOY_PATH/deployment.log
        
        echo "🎉 Déploiement terminé avec succès!"
        EOF
        
        # Make script executable and run it
        chmod +x deploy-to-vps.sh
        
        # Copy files to VPS
        scp -o StrictHostKeyChecking=no deploy-to-vps.sh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/
        scp -o StrictHostKeyChecking=no docker-compose.production.yml ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_DEPLOY_PATH }}/
        scp -o StrictHostKeyChecking=no production-settings.json ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_DEPLOY_PATH }}/
        scp -o StrictHostKeyChecking=no init-voice-features.js ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_DEPLOY_PATH }}/
        
        # Execute deployment on VPS
        ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "bash /tmp/deploy-to-vps.sh"

  # Job 3: Post-deployment verification
  verify-deployment:
    needs: [build-and-test, deploy-to-vps]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 🔍 Verify deployment
      run: |
        echo "🔍 Vérification du déploiement..."
        
        # Wait for application to be ready
        sleep 60
        
        # Test main application
        if curl -f http://${{ env.VPS_HOST }}/ > /dev/null 2>&1; then
          echo "✅ Application principale accessible"
        else
          echo "❌ Application principale non accessible"
          exit 1
        fi
        
        # Test voice features API
        if curl -f http://${{ env.VPS_HOST }}/api/v1/synq/voice/rooms > /dev/null 2>&1; then
          echo "✅ API des fonctionnalités vocales accessible"
        else
          echo "⚠️ API des fonctionnalités vocales non accessible (normal si pas d'auth)"
        fi
        
        # Test WebRTC endpoints
        if curl -f http://${{ env.VPS_HOST }}/webrtc/ > /dev/null 2>&1; then
          echo "✅ Endpoints WebRTC accessibles"
        else
          echo "⚠️ Endpoints WebRTC non accessibles"
        fi
        
        echo "🎉 Vérification terminée avec succès!"

  # Job 4: Notify deployment status
  notify:
    needs: [build-and-test, deploy-to-vps, verify-deployment]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📢 Notify deployment status
      run: |
        if [ "${{ needs.verify-deployment.result }}" == "success" ]; then
          echo "🎉 Déploiement réussi!"
          echo "🌐 Application: http://${{ env.VPS_HOST }}"
          echo "🎤 Fonctionnalités vocales: Activées"
          echo "📱 API REST: http://${{ env.VPS_HOST }}/api/v1/synq/voice/"
          echo "🏷️ Image: ${{ needs.build-and-test.outputs.image-tag }}"
        else
          echo "❌ Déploiement échoué!"
          echo "🔍 Vérifiez les logs pour plus de détails"
        fi
