name: 🚀 Auto-Deploy Synq Chat + Synq.Team

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
        - development

env:
  # VPS Configuration
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
  
  # Docker Registry
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  
  # Synq.Team Site Configuration
  SYNQ_TEAM_REPO: ${{ secrets.SYNQ_TEAM_REPO }}
  SYNQ_TEAM_TOKEN: ${{ secrets.SYNQ_TEAM_TOKEN }}
  SYNQ_TEAM_DEPLOY_URL: ${{ secrets.SYNQ_TEAM_DEPLOY_URL }}

jobs:
  # Job 1: Build and Test Synq Chat (Open Source Server)
  build-synq-chat:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: 📥 Checkout Synq Chat
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'

    - name: 📦 Install dependencies
      run: |
        yarn install --frozen-lockfile
        cd apps/meteor && yarn install --frozen-lockfile

    - name: 🧪 Run tests
      run: |
        yarn test:unit
        cd apps/meteor && yarn test:unit

    - name: 🔨 Build application
      run: |
        yarn build
        cd apps/meteor && yarn build

    - name: 📋 Extract version
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📋 Version: $VERSION"

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: 📋 Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/synq-chat
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🏗️ Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  # Job 2: Deploy Synq Chat to VPS
  deploy-synq-chat:
    needs: build-synq-chat
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔑 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ env.VPS_SSH_KEY }}

    - name: 🚀 Deploy Synq Chat to VPS
      run: |
        # Create deployment script for Synq Chat
        cat > deploy-synq-chat.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "🚀 Déploiement automatique Synq Chat (Serveur Open Source)"
        echo "📦 Image: ${{ needs.build-synq-chat.outputs.image-tag }}"
        echo "🏷️ Version: ${{ needs.build-synq-chat.outputs.version }}"
        
        # Variables
        IMAGE_TAG="${{ needs.build-synq-chat.outputs.image-tag }}"
        DEPLOY_PATH="${{ env.VPS_DEPLOY_PATH }}"
        BRANCH_NAME="${{ github.ref_name }}"
        COMMIT_SHA="${{ github.sha }}"
        VERSION="${{ needs.build-synq-chat.outputs.version }}"
        
        # Login to Docker registry
        echo "🔐 Connexion au registry Docker..."
        echo "${{ env.DOCKER_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u "${{ env.DOCKER_USERNAME }}" --password-stdin
        
        # Pull latest image
        echo "📥 Téléchargement de la nouvelle image Synq Chat..."
        docker pull $IMAGE_TAG
        
        # Stop existing containers
        echo "⏹️ Arrêt des conteneurs Synq Chat existants..."
        cd $DEPLOY_PATH
        docker-compose -f docker-compose.production.yml down || true
        
        # Update docker-compose.yml with new image
        echo "📝 Mise à jour de la configuration Synq Chat..."
        sed -i "s|image: .*synq-chat.*|image: $IMAGE_TAG|g" docker-compose.production.yml
        
        # Update version in environment
        echo "📝 Mise à jour de la version..."
        sed -i "s|SYNQ_VERSION=.*|SYNQ_VERSION=$VERSION|g" docker-compose.production.yml
        
        # Start new containers
        echo "▶️ Démarrage des nouveaux conteneurs Synq Chat..."
        docker-compose -f docker-compose.production.yml up -d
        
        # Wait for health check
        echo "⏳ Vérification de la santé de Synq Chat..."
        sleep 30
        
        # Health check
        if curl -f http://localhost/health > /dev/null 2>&1; then
          echo "✅ Synq Chat déployé avec succès!"
        else
          echo "❌ Échec du déploiement Synq Chat - Application non accessible"
          exit 1
        fi
        
        # Cleanup old images
        echo "🧹 Nettoyage des anciennes images..."
        docker image prune -f
        
        # Log deployment
        echo "📝 Log du déploiement Synq Chat..."
        echo "$(date): Synq Chat déployé - Branch: $BRANCH_NAME, Commit: $COMMIT_SHA, Version: $VERSION, Image: $IMAGE_TAG" >> $DEPLOY_PATH/synq-chat-deployment.log
        
        echo "🎉 Déploiement Synq Chat terminé avec succès!"
        EOF
        
        # Make script executable and run it
        chmod +x deploy-synq-chat.sh
        
        # Copy files to VPS
        scp -o StrictHostKeyChecking=no deploy-synq-chat.sh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/
        scp -o StrictHostKeyChecking=no docker-compose.production.yml ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_DEPLOY_PATH }}/
        scp -o StrictHostKeyChecking=no production-settings.json ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_DEPLOY_PATH }}/
        scp -o StrictHostKeyChecking=no init-voice-features.js ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.VPS_DEPLOY_PATH }}/
        
        # Execute deployment on VPS
        ssh -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "bash /tmp/deploy-synq-chat.sh"

  # Job 3: Update Synq.Team (Service Website)
  update-synq-team:
    needs: [build-synq-chat, deploy-synq-chat]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 📥 Checkout Synq.Team
      uses: actions/checkout@v4
      with:
        repository: ${{ env.SYNQ_TEAM_REPO }}
        token: ${{ env.SYNQ_TEAM_TOKEN }}
        fetch-depth: 0

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔄 Update Synq.Team with new version
      run: |
        echo "🔄 Mise à jour de Synq.Team avec la nouvelle version Synq Chat"
        
        # Update version in package.json
        VERSION="${{ needs.build-synq-chat.outputs.version }}"
        sed -i "s/\"synq-version\": \".*\"/\"synq-version\": \"$VERSION\"/g" package.json
        
        # Update version in components
        echo "📝 Mise à jour des composants avec la nouvelle version..."
        
        # Update hero component
        sed -i "s/Version [0-9.]*/Version $VERSION/g" components/hero.tsx || true
        
        # Update feature cards
        sed -i "s/Dernière mise à jour: [0-9-]*/Dernière mise à jour: $(date +%Y-%m-%d)/g" components/feature-cards.tsx || true
        
        # Create version update commit
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "🔄 Auto-update: Synq Chat v$VERSION deployed

- Serveur open source Synq Chat mis à jour vers v$VERSION
- Nouvelles fonctionnalités vocales natives déployées
- Fonctionnalités disponibles:
  - Salles vocales persistantes
  - Appels audio/vidéo natifs
  - Partage d'écran natif
  - Chat intégré temps réel
  - Modération avancée
  - API REST complète

Déployé automatiquement depuis GitHub Actions" || echo "No changes to commit"

    - name: 🚀 Deploy Synq.Team
      run: |
        echo "🚀 Déploiement de Synq.Team (Site du service)"
        
        # Build the site
        npm run build
        
        # Deploy to VPS or hosting service
        if [ -n "${{ env.SYNQ_TEAM_DEPLOY_URL }}" ]; then
          echo "📤 Déploiement vers ${{ env.SYNQ_TEAM_DEPLOY_URL }}"
          # Add deployment logic here (rsync, scp, etc.)
        else
          echo "⚠️ URL de déploiement Synq.Team non configurée"
        fi

    - name: 📤 Push changes to Synq.Team repo
      run: |
        git push origin main || echo "Push failed or no changes"

  # Job 4: Verify both deployments
  verify-deployments:
    needs: [build-synq-chat, deploy-synq-chat, update-synq-team]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 🔍 Verify Synq Chat deployment
      run: |
        echo "🔍 Vérification du déploiement Synq Chat (Serveur Open Source)..."
        
        # Wait for application to be ready
        sleep 60
        
        # Test main application
        if curl -f http://${{ env.VPS_HOST }}/ > /dev/null 2>&1; then
          echo "✅ Synq Chat (Serveur Open Source) accessible"
        else
          echo "❌ Synq Chat non accessible"
          exit 1
        fi
        
        # Test voice features API
        if curl -f http://${{ env.VPS_HOST }}/api/v1/synq/voice/rooms > /dev/null 2>&1; then
          echo "✅ API des fonctionnalités vocales accessible"
        else
          echo "⚠️ API des fonctionnalités vocales non accessible (normal si pas d'auth)"
        fi
        
        # Test WebRTC endpoints
        if curl -f http://${{ env.VPS_HOST }}/webrtc/ > /dev/null 2>&1; then
          echo "✅ Endpoints WebRTC accessibles"
        else
          echo "⚠️ Endpoints WebRTC non accessibles"
        fi

    - name: 🔍 Verify Synq.Team deployment
      run: |
        echo "🔍 Vérification du déploiement Synq.Team (Site du service)..."
        
        # Test Synq.Team site
        if curl -f http://${{ env.SYNQ_TEAM_DEPLOY_URL }}/ > /dev/null 2>&1; then
          echo "✅ Synq.Team (Site du service) accessible"
        else
          echo "⚠️ Synq.Team non accessible ou URL non configurée"
        fi

  # Job 5: Notify deployment status
  notify:
    needs: [build-synq-chat, deploy-synq-chat, update-synq-team, verify-deployments]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📢 Notify deployment status
      run: |
        if [ "${{ needs.verify-deployments.result }}" == "success" ]; then
          echo "🎉 Déploiement complet réussi!"
          echo ""
          echo "📦 Synq Chat (Serveur Open Source):"
          echo "  🌐 URL: http://${{ env.VPS_HOST }}"
          echo "  🎤 Fonctionnalités vocales: Activées"
          echo "  📱 API REST: http://${{ env.VPS_HOST }}/api/v1/synq/voice/"
          echo "  🏷️ Version: ${{ needs.build-synq-chat.outputs.version }}"
          echo "  🐳 Image: ${{ needs.build-synq-chat.outputs.image-tag }}"
          echo ""
          echo "🌐 Synq.Team (Site du service):"
          echo "  🌐 URL: http://${{ env.SYNQ_TEAM_DEPLOY_URL }}"
          echo "  🔄 Mis à jour avec la nouvelle version"
          echo "  📋 Fonctionnalités présentées sur le site"
          echo ""
          echo "✨ Architecture complète déployée:"
          echo "  - Serveur open source Synq Chat"
          echo "  - Site du service Synq.Team"
          echo "  - Auto-publication par IA activée"
        else
          echo "❌ Déploiement échoué!"
          echo "🔍 Vérifiez les logs pour plus de détails"
        fi
